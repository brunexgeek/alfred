<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ .PageTitle }}</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            margin-bottom: .5em;
        }
        .item-language {
            text-transform: uppercase;
        }
    </style>
</head>
<body class="page-{{ .PageType }}">
    <h1>{{ .PageTitle }}</h1>
    <ul>
        {{ range .Items }}
            <li>
                <a href='{{ .Id }}' class="item-{{ .Type }}">{{ .Title }}</a>
            </li>
        {{end}}
    </ul>
</body>
</html>
