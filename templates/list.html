<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{.Title}}</title>
</head>
<body>
    <h1>{{.Title}}</h1>
    <ul>
        <!-- Products -->
        {{ range .Menu }}
            <li>
                <a href='{{.Url}}'>{{.Title}}</a>
                <ul>
                    <!-- Languages -->
                    {{ range .Children }}
                        <li>
                            <a href='{{.Url}}'>{{.Title}}</a>
                            <ul>
                                <!-- Versions -->
                                {{ range .Children }}
                                    <li>
                                        <a href='{{.Url}}'>{{.Title}}</a>
                                        <ul>
                                            <!-- Formats -->
                                            {{ range .Children }}
                                                <li><a href='{{.Url}}'>{{.Title}}</a></li>
                                            {{ end }}
                                        </ul>
                                    </li>
                                {{ end }}
                            </ul>
                        </li>
                    {{ end }}
                </ul>
            </li>
        {{end}}
    </ul>
</body>
</html>
