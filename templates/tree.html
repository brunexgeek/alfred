<!--

The page context (top level '.' or '$.') is an 'catalog.Context' object:

type Context struct {
    PageTitle string      // suggested title for the page based on the page type, after substitution
    PageType  string      // page type; possible values are 'environment', 'product', 'language' and 'version'
    Strings   StringMap   // object to perform substitutions; uses values from 'environment.strings'
    Items     []*MenuItem // array of items in this level
}

type MenuItem struct {
	Path     string // unique ID
	NormalId string // normalized ID for sorting
	Title    string // same as 'Path' or substitution
	Type     string // item type; possible values are 'product', 'language', 'version' and 'format'
    Children []*MenuItem // array of children nodes
}

-->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ .PageTitle }}</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            margin-bottom: .5em;
            display: inline-block;
        }
        .item-language {
            text-transform: uppercase;
        }
    </style>
</head>

<body class="page-{{ .PageType }}">
    <h1>{{ .PageTitle }}</h1>
    <ul>
        {{- range .Items }}
        <li>
            <a href='{{ .Path }}' class="item-{{ .Type }}">{{ .Title }}</a>
            <ul>
                {{- range .Children }}
                <li>
                    <a href='{{ .Path }}' class="item-{{ .Type }}">{{ .Title }}</a>
                    <ul>
                        {{- range .Children }}
                        <li>
                            <a href='{{ .Path }}' class="item-{{ .Type }}">{{ .Title }}</a>
                            <ul>
                                {{- range .Children }}
                                <li>
                                    <a href='{{ .Path }}' class="item-{{ .Type }}">{{ .Title }}</a>
                                </li>
                                {{- end}}
                            </ul>
                        </li>
                        {{- end}}
                    </ul>
                </li>
                {{- end}}
            </ul>
        </li>
        {{- end}}
    </ul>
</body>

</html>
